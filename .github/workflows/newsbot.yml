name: newsbot

# Täglich Entwürfe erzeugen. Du liest sie (Zusammenfassung des Laufs) und gibst sie frei:
# Actions > newsbot > Run workflow > Feld "approve" (IDs oder "alle"). Erst dann gehen Website und Social Media online.
on:
  schedule:
    - cron: "17 5,11,17 * * *"   # dreimal täglich (UTC), damit Deals nicht durchrutschen
  workflow_dispatch:
    inputs:
      approve:
        description: 'Entwürfe freigeben: IDs (mit Komma) oder "alle". Leer lassen = neue Entwürfe erzeugen.'
        required: false
        default: ""
      reject:
        description: 'Entwürfe ablehnen: IDs (mit Komma). Abgelehnte gehen nie online.'
        required: false
        default: ""
      rewrite:
        description: 'Beiträge nach aktuellem Briefing neu schreiben: IDs (mit Komma) oder "alle". Sie kommen als Entwürfe in die Freigabe.'
        required: false
        default: ""
      only_decisions:
        description: 'Nur "ja" setzen, wenn nur WhatsApp-Entscheidungen umgesetzt und keine neuen Entwürfe erzeugt werden sollen (setzt der Webhook).'
        required: false
        default: ""

concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Entwürfe freigeben
        if: ${{ inputs.approve != '' }}
        env:
          APPROVE: ${{ inputs.approve }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m newsbot approve "$APPROVE"
      - name: Entwürfe ablehnen
        if: ${{ inputs.reject != '' }}
        run: python -m newsbot reject "$REJECT"
        env:
          REJECT: ${{ inputs.reject }}
      - name: WhatsApp-Entscheidungen umsetzen
        # Klicks auf "Freigeben"/"Ablehnen" legt der Webhook als Dateien in data/decisions/ ab (siehe README).
        # Dieser Schritt läuft bei jedem Lauf; liegen keine Dateien da, passiert nichts.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m newsbot decisions
      - name: Beiträge neu schreiben
        if: ${{ inputs.rewrite != '' }}
        env:
          REWRITE: ${{ inputs.rewrite }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m newsbot rewrite "$REWRITE"
      - name: Neue Entwürfe erzeugen
        if: ${{ inputs.approve == '' && inputs.reject == '' && inputs.rewrite == '' && inputs.only_decisions != 'ja' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # optional: ohne Key stumme Videos
        run: python -m newsbot generate
      - name: Titelfotos holen
        # Pixabay/Pexels (mit Schlüssel) und freie Wikimedia-Bilder; Claude wählt das passende. Ein Fehler stoppt den Lauf nicht.
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m newsbot photos || true
      - name: Direkte Amazon-Produktlinks holen
        # Liest die Quellseiten nach amazon.de/dp/...-Links; ohne Treffer bleibt der Suchlink. Fehler stoppen den Lauf nicht.
        run: python -m newsbot products || true
      - name: Entwürfe per WhatsApp schicken
        if: ${{ inputs.approve == '' && inputs.reject == '' && inputs.rewrite == '' && inputs.only_decisions != 'ja' }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python -m newsbot notify
      - name: Zustand ins Repo sichern
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Neue Beiträge"
            # Parallele Läufe oder Klicks in der Admin-Seite ändern dieselben Dateien: bei Konflikt gilt der eigene Stand, dann erneut versuchen.
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "Konnte den Zustand nicht sichern" >&2; exit 1
          fi
      - run: python -m newsbot build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  social:
    # Instagram/Facebook laden Bild und Video von der Website, daher erst nach dem Deploy.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m newsbot build   # Videodatei für den TikTok-Upload lokal bereitstellen
      - name: Neue Seiten an Bing melden (IndexNow)
        # Erst nach dem Deploy, damit Bing die neuen Seiten schon abrufen kann. Ein Fehler stoppt den Lauf nicht.
        run: python -m newsbot indexnow || true
      - name: Auf Social Media posten
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python -m newsbot publish
      - name: Veröffentlichungsstatus sichern
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Social-Status"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "Konnte den Social-Status nicht sichern" >&2; exit 1
          fi
