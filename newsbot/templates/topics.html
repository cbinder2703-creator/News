{% extends "base.html" %}
{% block main %}
<header class="page-head"><h1>Alle Themen</h1></header>
{% if not cats %}<p class="empty">Noch keine Beiträge.</p>{% endif %}
<ul class="topics">
{% for c in cats %}<li><a href="{{ base }}/thema/{{ c.slug }}/">{{ c.name }} <span class="muted">{{ c.records | length }}</span></a></li>{% endfor %}
</ul>
{% endblock %}
