{% extends "base.html" %}
{% block main %}
<h1>Alle Themen</h1>
{% if not cats %}<p class="empty">Noch keine Beiträge.</p>{% endif %}
<ul class="topics">
{% for c in cats %}<li><a href="{{ base }}/thema/{{ c.slug }}/">{{ c.name }}</a> <span class="muted">({{ c.records | length }})</span></li>{% endfor %}
</ul>
{% endblock %}
