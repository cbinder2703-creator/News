# Zentrale Einstellungen der Nachrichtenmarke.
# Secrets (API-Keys, Tokens) gehören NICHT hierher, sondern in .env bzw. GitHub Secrets.

brand:
  name: "DealPuls"
  tagline: "Deals und Kaufberatung: Lohnt sich das wirklich?"
  site_url: "https://dealpuls.de"       # ohne Slash am Ende; Domain muss in GitHub Pages als Custom Domain eingetragen sein
  accent: "#ff4d2e"
  contact_email: "kontakt@dealpuls.de"  # für Impressum; Postfach bei Strato einrichten

ai:
  model: "claude-sonnet-5-5"
  disclosure: "Mit KI entworfen, vor der Veröffentlichung von uns geprüft."   # nur im Modus review; bei auto erscheint automatisch ein anderer Text

voice:                       # Sprecherstimme für die Videos (ElevenLabs)
  enabled: true              # braucht das Secret ELEVENLABS_API_KEY, sonst entstehen stumme Videos
  voice_id: "21m00Tcm4TlvDq8ikWAM"   # Standardstimme "Rachel"; eigene Stimme in der ElevenLabs-Bibliothek wählen
  model_id: "eleven_multilingual_v2" # deutsch-fähiges Modell; ggf. durch ein neueres ersetzen

# Redaktionelle Linie: Das ist dein Hebel. Hier legst du Haltung und Themen fest, die KI hält sich daran.
editorial:
  mode: review               # review: KI erstellt Entwürfe, du gibst sie frei (wenige Minuten) | auto: ohne Freigabe
  haltung: |
    Wir lieben gute Technik und gute Deals und zeigen sie mit Begeisterung. Jeder Beitrag macht Lust auf das Produkt:
    Was kann es richtig gut, wie fühlt sich der Alltag damit an, für wen ist es ein Volltreffer. Ton: lebendig, warm,
    zuversichtlich, wie ein Freund, der dir einen echten Tipp gibt. Keine Bedenkenträgerei, keine Panikmache,
    keine erfundenen Fakten, keine künstliche Eile. Wir testen nicht selbst und behaupten das auch nicht.
  rubriken:
    - { name: "Deal-Check",       frage: "Was bekommst du für den Preis, was ist daran richtig gut, und für wen ist das Angebot ein Volltreffer?" }
    - { name: "Lohnt sich das?",  frage: "Was macht das neue Gerät oder Update im Alltag besser, und für wen lohnt sich der Umstieg?" }
    - { name: "Ratgeber",         frage: "Wie findest du das Gerät, das perfekt zu dir passt? Kriterien und Tipps, keine Produkttests und keine Rankings." }
    - { name: "Neuheiten-Check",  frage: "Was ist neu, was ist daran spannend, und für wen wird das Gerät interessant?" }
    - { name: "Kurz erklärt",     frage: "Was ist neu, was hast du davon, und was ist der eine Tipp, der dir sofort hilft?" }
  # Quellen (Liste unter Beiträgen, Verweise im Seitencode, Quellenzeile in Videokarten, Sprechtext und Instagram-Text) öffentlich zeigen?
  # false: nur du siehst sie (Admin-Seite). Im Fließtext steht weiterhin, wer etwas berichtet ("Laut heise ..."). Siehe README.
  show_sources: false
  # Video auf der Beitragsseite einbetten? Die Videos entstehen weiter für TikTok/Instagram, hier stören sie eher.
  show_video: false
  kaufbezug: true            # Chefredaktion bevorzugt Themen, die Kaufentscheidungen betreffen (false = reine Nachrichtenauswahl)
  # Alle Produktbereiche; Schwerpunkt auf dem, wonach viele Menschen bei Google suchen.
  focus: ["Produkte aus allen Bereichen, nach denen viele Menschen suchen", "Kaufentscheidungen, Preisänderungen und Neuheiten", "Folgen für Käufer"]
  # Meiden, auch weil Google hier besonders strenge Maßstäbe anlegt (YMYL) und KI-Texte schlechter ranken:
  avoid: ["Angebote ohne konkrete Preisangabe in der Quelle", "Gewinnspiele", "reine Gerüchte",
          "Gesundheits- und Medizinprodukte mit Heilversprechen", "Finanzprodukte und Geldanlage",
          "Erotik, Glücksspiel, Waffen"]

# Affiliate: Produkt-Links nur als gekennzeichneter Kasten unter dem Beitrag, nie im Text oder in der Einordnung.
affiliate:
  enabled: true              # erst auf true, wenn mindestens ein Programm unten aktiv ist
  max_links_per_article: 3
  disclosure: "Anzeige: Wenn du über diese Links kaufst, erhalten wir eventuell eine Provision. Für dich ändert sich der Preis nicht. Unsere Einordnung im Beitrag ist davon unabhängig."
  amazon_notice: "Als Amazon-Partner verdiene ich an qualifizierten Verkäufen."   # Wortlaut bitte in PartnerNet prüfen
  programs:
    - name: "Amazon"
      kind: amazon
      enabled: true
      domain: "www.amazon.de"
      tag: "dealpuls-21"     # Tracking-ID aus PartnerNet
    - name: "OTTO"
      kind: template         # läuft über Awin; IDs stehen in deinem Awin-Konto
      enabled: false
      search_url: "https://www.otto.de/suche/{query}/"
      link_template: "https://www.awin1.com/cread.php?awinmid=DEINE_OTTO_MERCHANT_ID&awinaffid=DEINE_AWIN_ID&ued={url}"

# Kaufberater: zeitlose Ratgeberseiten unter /kaufberater/<slug>/, die bei Google ranken sollen.
# Jeder entsteht als Entwurf und geht erst nach deiner Freigabe online. News verlinken automatisch auf den passenden.
# Neue Fassung schreiben lassen (z. B. alle paar Monate): python -m newsbot guide <slug>
guides:
  enabled: false             # true: pro Lauf werden fehlende Kaufberater geschrieben (Kosten: ca. 1 längerer KI-Aufruf je Kaufberater)
  per_run: 1                 # höchstens so viele neue Kaufberater pro Lauf
  topics:                    # BEISPIELE: durch deine Nische ersetzen. slug = Adresse, keyword = Suchbegriff bei Google
    - { slug: "saugroboter", title: "Saugroboter", keyword: "Saugroboter kaufen", category: "Smart Home" }
    - { slug: "powerbank", title: "Powerbank", keyword: "Powerbank kaufen", category: "Zubehör" }
    - { slug: "wlan-router", title: "WLAN-Router", keyword: "WLAN Router kaufen", category: "Netz" }

# Admin-Seite zum Freigeben unter /admin/ (Login über einen kleinen Cloudflare-Worker, siehe README "Admin-Seite").
# Leer lassen = es wird keine Admin-Seite gebaut. Danach hier die Adresse des Workers eintragen, z. B. https://dealpuls-admin.DEIN-NAME.workers.dev
admin:
  api_url: "https://dealpuls-admin.c-binder2703.workers.dev"

# Kontaktformular im Impressum (zweiter Kontaktweg neben der E-Mail). Dienst: Web3Forms (web3forms.com).
# access_key: den kostenlosen Zugangsschlüssel bekommst du per E-Mail (er ist öffentlich gedacht und kein Geheimnis).
# Leer lassen = kein Formular, nur die E-Mail-Adresse. Siehe README "Kontaktformular".
contact_form:
  access_key: ""

pipeline:
  articles_per_run: 3      # Themen pro Lauf (täglich)
  max_age_hours: 24          # nur Meldungen, die jünger sind
  max_auto_risk: medium      # low | medium  -> "high" wird nie automatisch veröffentlicht
  videos_for_recent: 0       # Videos nur für die letzten N Beiträge erzeugen. 0 = aus: ohne ElevenLabs-Stimme wären sie stumm. Zum Einschalten z. B. 20 und ELEVENLABS_API_KEY setzen
  publish_per_run: 2         # max. Social-Posts (Beiträge) pro Lauf und Plattform

social:
  graph_version: "v23.0"
  facebook: [link]           # link | video | [] zum Abschalten
  instagram: [image, reel]   # image | reel | []
  tiktok: [video]            # video | []
  tiktok_privacy: "SELF_ONLY"   # erst nach TikTok-Audit auf PUBLIC_TO_EVERYONE stellen

# Quellen: nur Titel + RSS-Teaser werden gelesen, der Beitrag wird neu formuliert,
# die Quelle wird immer genannt und verlinkt.
sources:
  - { name: "heise online", url: "https://www.heise.de/rss/heise-atom.xml" }
  - { name: "Golem.de",     url: "https://rss.golem.de/rss.php?feed=RSS2.0" }
  - { name: "THE DECODER",  url: "https://the-decoder.de/feed/" }
  - { name: "t3n",          url: "https://t3n.de/rss.xml" }
