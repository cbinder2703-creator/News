# Zentrale Einstellungen der Nachrichtenmarke.
# Secrets (API-Keys, Tokens) gehören NICHT hierher, sondern in .env bzw. GitHub Secrets.

brand:
  name: "TechPuls"                      # Arbeitstitel, einfach ändern
  tagline: "KI- und Tech-News, kurz und verständlich"
  site_url: "https://DEIN-NAME.github.io/news"   # ohne Slash am Ende
  accent: "#ff4d2e"
  contact_email: "kontakt@example.com"  # für Impressum

ai:
  model: "claude-opus-5-5"
  disclosure: "Dieser Beitrag wurde mit KI auf Basis der genannten Quellen erstellt."

voice:                       # Sprecherstimme für die Videos (ElevenLabs)
  enabled: true              # braucht das Secret ELEVENLABS_API_KEY, sonst entstehen stumme Videos
  voice_id: "21m00Tcm4TlvDq8ikWAM"   # Standardstimme "Rachel"; eigene Stimme in der ElevenLabs-Bibliothek wählen
  model_id: "eleven_multilingual_v2" # deutsch-fähiges Modell; ggf. durch ein neueres ersetzen

# Redaktionelle Linie: Das ist dein Hebel. Hier legst du Haltung und Themen fest, die KI hält sich daran.
editorial:
  mode: review               # review: KI erstellt Entwürfe, du gibst sie frei (wenige Minuten) | auto: ohne Freigabe
  haltung: |
    Wir erklären Tech- und KI-Themen nüchtern und verständlich für Menschen ohne Vorwissen.
    Wir sind kritisch, aber fair: Wir prüfen Ankündigungen auf ihren tatsächlichen Gehalt, trennen
    Fakten von Marketing und Spekulation, benennen Unsicherheiten offen und erklären, was etwas für
    Nutzerinnen und Nutzer konkret bedeutet. Keine Panikmache, kein Hype, keine Schadenfreude.
  rubriken:
    - { name: "Hype-Check",          frage: "Was ist an der großen Ankündigung dran, was fehlt, was ist reines Marketing?" }
    - { name: "Was steckt dahinter?", frage: "Welcher Hintergrund und welche Zusammenhänge helfen, die Meldung zu verstehen?" }
    - { name: "Kurz erklärt",         frage: "Was ist passiert und was bedeutet das für Nutzer, in einfachen Worten?" }
    - { name: "Ratgeber",             frage: "Worauf sollten Käufer achten? Kriterien und Fragen, keine Produkttests und keine Rankings." }
  focus: ["KI und Sprachmodelle", "Datenschutz und Sicherheit im Alltag", "Folgen für Nutzer"]   # bevorzugte Themen
  avoid: ["Rabattaktionen und Deals", "Gewinnspiele", "reine Gerüchte"]                           # meiden

# Affiliate: Produkt-Links nur als gekennzeichneter Kasten unter dem Beitrag, nie in Einordnung oder Themenwahl.
affiliate:
  enabled: false             # erst auf true, wenn mindestens ein Programm unten aktiv ist
  max_links_per_article: 3
  disclosure: "Anzeige: Wenn du über diese Links kaufst, erhalten wir eventuell eine Provision. Für dich ändert sich der Preis nicht. Unsere Einordnung im Beitrag ist davon unabhängig."
  amazon_notice: "Als Amazon-Partner verdiene ich an qualifizierten Verkäufen."   # Wortlaut bitte in PartnerNet prüfen
  programs:
    - name: "Amazon"
      kind: amazon
      enabled: false         # true setzen, sobald dein PartnerNet-Konto freigeschaltet ist
      domain: "www.amazon.de"
      tag: ""                # deine Tracking-ID, z. B. meinname-21
    - name: "OTTO"
      kind: template         # läuft über Awin; IDs stehen in deinem Awin-Konto
      enabled: false
      search_url: "https://www.otto.de/suche/{query}/"
      link_template: "https://www.awin1.com/cread.php?awinmid=DEINE_OTTO_MERCHANT_ID&awinaffid=DEINE_AWIN_ID&ued={url}"

pipeline:
  articles_per_run: 3        # Themen pro Lauf (täglich)
  max_age_hours: 24          # nur Meldungen, die jünger sind
  max_auto_risk: medium      # low | medium  -> "high" wird nie automatisch veröffentlicht
  videos_for_recent: 20      # Videos nur für die letzten N Beiträge erzeugen
  publish_per_run: 2         # max. Social-Posts (Beiträge) pro Lauf und Plattform

social:
  graph_version: "v23.0"
  facebook: [link]           # link | video | [] zum Abschalten
  instagram: [image, reel]   # image | reel | []
  tiktok: [video]            # video | []
  tiktok_privacy: "SELF_ONLY"   # erst nach TikTok-Audit auf PUBLIC_TO_EVERYONE stellen

# Quellen: nur Titel + RSS-Teaser werden gelesen, der Beitrag wird neu formuliert,
# die Quelle wird immer genannt und verlinkt.
sources:
  - { name: "heise online", url: "https://www.heise.de/rss/heise-atom.xml" }
  - { name: "Golem.de",     url: "https://rss.golem.de/rss.php?feed=RSS2.0" }
  - { name: "THE DECODER",  url: "https://the-decoder.de/feed/" }
  - { name: "t3n",          url: "https://t3n.de/rss.xml" }
